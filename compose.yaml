services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -e
        - 'exit(Net::HTTP.get_response(URI("http://127.0.0.1:8000/health")).is_a?(Net::HTTPSuccess) ? 0 : 1)'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
